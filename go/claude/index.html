<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Opening Claude</title>
<style>body{font:17px/1.5 -apple-system,system-ui,sans-serif;margin:0;padding:32px 20px;background:#1c211d;color:#ece9e0}a{color:#8fe6a4}p{max-width:36ch}</style>
</head><body>
<p id="msg">Opening Claude…</p>
<p><a id="link" href="https://claude.ai/new">Tap here if nothing happens</a></p>
<p style="opacity:.6;font-size:14px">Opens a new Claude chat. From a Siri shortcut this lands in the Claude app; from this page on an iPhone it opens claude.ai in Safari, where you are already signed in.</p>
<script>
(function () {
  var t = {"ios":"https://claude.ai/new","android":"https://claude.ai/new","web":"https://claude.ai/new"};
  var ua = navigator.userAgent;
  var p = /iPhone|iPad|iPod/i.test(ua) ? 'ios' : /Android/i.test(ua) ? 'android' : 'other';
  var href = (p === 'ios' && t.ios) || (p === 'android' && t.android) || t.web;
  if (!href) { document.getElementById('msg').textContent = "Claude" + ' opens from a phone.'; return; }
  document.getElementById('link').href = href;
  location.href = href;
  if (t.web && href !== t.web) setTimeout(function () { if (!document.hidden) location.href = t.web; }, 1600);
})();
</script>
</body></html>
